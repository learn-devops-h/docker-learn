version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: music-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - music-network

  backend:
    build: ./backend
    container_name: music-backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - MONGO_URI=mongodb://mongodb:27017/musicplayer
    volumes:
      - ./backend/uploads:/app/uploads  # Persist uploaded files
    depends_on:
      - mongodb
    networks:
      - music-network

  frontend:
    build: ./frontend
    container_name: music-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  mongodb_data:
